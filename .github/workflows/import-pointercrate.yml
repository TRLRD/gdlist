name: Import Pointercrate

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message != 'Import Pointercrate source'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gdlist
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source
        run: |
          git clone --depth 1 https://github.com/stadust/pointercrate.git source
          rm -rf source/.git

      - name: Push source into gdlist
        run: |
          cp -a source/. .
          rm -rf source
          rm -f pointercrate-master.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Pointercrate source"
          git push origin HEAD:main
